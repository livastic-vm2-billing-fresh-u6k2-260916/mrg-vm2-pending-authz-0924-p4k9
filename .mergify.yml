queue_rules:
  - name: default
    queue_conditions:
      - title = VM2_PENDING_ARM_P4K9
    merge_conditions: []
    merge_method: merge
    batch_size: 1
    batch_max_wait_time: 0 seconds

merge_queue:
  mode: serial
  max_parallel_checks: 1

pull_request_rules:
  - name: VM2 approval revocation freshness gate
    conditions:
      - approved-reviews-by = livastic-vm2-secondary-20260911
      - title = VM2_APPROVAL_ARM_0928
      - check-success = vm2-authz-gate
    actions:
      merge:
        method: merge
